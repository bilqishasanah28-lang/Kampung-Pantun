<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17324a">
<title>Kampung Pantun – Petualangan Pemburu Rima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#7ed3ff;--sky2:#d9f4ff;--mint:#9ce8c7;--mint-d:#3fbf8f;--sun:#ffd84d;--orange:#ff9a3c;--orange-d:#e57a14;
  --wood:#a8693a;--wood-d:#6b4226;--pink:#ffc4d9;--cream:#fff8e6;--ink:#4a2e1b;
  --A:#ff7a3d;--B:#2e9bff;--ok:#2fb86f;
  --f:'Fredoka','Baloo 2','Nunito','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17324a;font-family:var(--f);color:var(--ink);overscroll-behavior:none}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 30% 20%,#245a7d,#12293d)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;aspect-ratio:16/9;transform-origin:0 0;background:#bfe9ff;overflow:hidden;opacity:0;transition:opacity .5s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage.ready{opacity:1}
button{font-family:inherit}
.screen{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.screen.active{opacity:1;visibility:visible}




.htabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.htab{font-family:inherit;font-weight:700;font-size:26px;padding:8px 22px;border-radius:999px;border:5px solid var(--wood);background:#fff7e0;color:var(--wood-d);cursor:pointer;box-shadow:0 5px 0 var(--wood-d);transition:translate .15s,background .2s}
.htab.on{background:linear-gradient(#ffd84d,#ffb92e);border-color:#d9a400;box-shadow:0 5px 0 #b88700}
@media (hover:hover){.htab:hover{translate:0 -3px}}
.htab:active{translate:0 2px}
.hbody{min-height:560px;text-align:left}.hp{display:none}.hp.on{display:block;animation:fade .25s}
.hp ul.hl{font-size:30px;font-weight:600;line-height:1.35;margin:6px 0 0;padding-left:44px}.hp ul.hl li{margin:9px 0}
.hp .sub{font-size:30px;font-weight:700;color:var(--wood-d);margin:14px 0 2px}
.hp .nm{margin-top:0;text-align:center}
.pnt{margin:16px auto 0;padding:16px 28px;border-radius:26px;background:#fff;border:5px dashed #ffd27a;font-size:32px;font-weight:600;line-height:1.5;text-align:center}
.pnt u{text-decoration-color:#ff9a3c;text-decoration-thickness:4px;font-weight:700}
.dev{display:flex;align-items:center;justify-content:center;gap:56px;min-height:540px;padding-bottom:20px;font-size:32px;font-weight:600;line-height:1.55;padding-top:30px}.dev .dn{font-size:44px;font-weight:700;color:var(--wood-d);margin-bottom:8px;line-height:1.2}
.dph{flex:none;width:330px;height:330px;border-radius:50%;overflow:hidden;border:12px solid var(--wood);box-shadow:0 10px 0 var(--wood-d),0 0 40px 10px rgba(255,230,120,.7);background:#fff}.dph img{width:100%;height:100%;object-fit:cover;display:block}.dtx{text-align:left}


/* ---------- tombol bergambar ---------- */
.round:has(>.rimg){background:none;border:0;box-shadow:none;width:92px;height:92px}
.round .rimg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 0 rgba(60,30,0,.28))}
.bimg{position:relative;flex:none;border:0;background:none;padding:0;cursor:pointer;border-radius:999px;font-family:inherit}
.bimg img{width:100%;height:100%;display:block;object-fit:fill;filter:drop-shadow(0 9px 0 rgba(0,40,30,.28))}
.bimg .bt{position:absolute;left:26%;right:4%;top:0;bottom:7%;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,50,60,.55)}
.bimg.big{width:590px;height:151px}.bimg.big .bt{font-size:32px}
.bimg.small{width:300px;height:80px;margin:0 10px}.bimg.small .bt{font-size:29px}
.bimg:active{transform:translateY(6px)}
.bimg:active img{filter:drop-shadow(0 2px 0 rgba(0,40,30,.28)) brightness(.97)}
@media (hover:hover){.bimg:hover,.round:hover:has(>.rimg){translate:0 -5px;filter:brightness(1.1) drop-shadow(0 0 22px rgba(255,236,140,.9))}}

/* ---------- efek hover & sentuh tombol ---------- */
.btn,.round,.pill,.opt,.node .orb,.node .lab,.pc,.pl.tap,.chip-w{transition:translate .15s ease,filter .15s ease,box-shadow .15s ease,transform .12s,background .2s}
@media (hover:hover){
  .btn:hover,.round:hover,.pill:hover,.opt:hover,.pc:hover,.pl.tap:hover,.chip-w:hover{translate:0 -5px;filter:brightness(1.08) saturate(1.1)}
  .btn:hover{box-shadow:0 8px 0 rgba(0,0,0,.18),0 0 34px 8px rgba(255,236,140,.75)}
  .btn.green:hover{box-shadow:0 8px 0 #2a9a72,0 0 34px 8px rgba(255,236,140,.75)}
  .btn.blue:hover{box-shadow:0 8px 0 #1d73c4,0 0 34px 8px rgba(255,236,140,.75)}
  .round:hover,.pill:hover{box-shadow:0 0 26px 6px rgba(255,236,140,.8)}
  .opt:hover:not(.ok):not(.no){background:#fffbe8;box-shadow:0 8px 0 #e8b64d,0 0 30px 6px rgba(255,220,100,.7)}
  .chip-w:hover{box-shadow:0 8px 0 #b88700,0 0 30px 8px rgba(255,230,120,.85)}
  .node:hover .orb{filter:brightness(1.12) drop-shadow(0 0 22px rgba(255,230,120,.95));translate:0 -6px}
  .node:hover .lab{translate:0 -3px;background:#fff}
  .node.lock:hover .orb{filter:grayscale(.85) brightness(1);translate:0 0}
}
.btn:active,.round:active,.pill:active,.opt:active,.pc:active,.chip-w:active{translate:0 0;filter:brightness(.97)}
.tch{animation:tch .55s ease-out}
@keyframes tch{from{outline:0 solid rgba(255,225,100,.95);outline-offset:0}to{outline:28px solid rgba(255,225,100,0);outline-offset:8px}}
.tdot{position:absolute;z-index:76;pointer-events:none;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fffbe0,rgba(255,225,110,.9) 45%,rgba(255,225,110,0) 72%);animation:tdot .6s ease-out forwards}
@keyframes tdot{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.8)}}


#loader{position:absolute;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:linear-gradient(#2a6fb5,#78c8f0 55%,#8fdc7a);color:#fff;font-weight:700;text-shadow:0 5px 0 rgba(0,40,80,.35)}
#loader.on{display:flex}
#loader .ld-t{font-size:110px;letter-spacing:3px;color:#ffe066}
#loader .ld-bar{width:820px;height:34px;border-radius:999px;background:rgba(255,255,255,.55);border:6px solid #fff;overflow:hidden;box-shadow:0 6px 0 rgba(0,40,80,.25)}
#loader .ld-bar i{display:block;height:100%;width:6%;background:linear-gradient(#7dff9b,#1fbf5a);border-radius:999px;transition:width .3s}
#loader .ld-p{font-size:38px}

/* ---------- efek cahaya ---------- */
.lights{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rays{position:absolute;right:-380px;top:-980px;width:2000px;height:2000px;border-radius:50%;mix-blend-mode:screen;opacity:.55;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,244,190,.55) 0deg 7deg,rgba(255,244,190,0) 7deg 20deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);mask:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);
  animation:raySpin 90s linear infinite,rayPulse 6s ease-in-out infinite}
@keyframes raySpin{to{transform:rotate(360deg)}}
@keyframes rayPulse{50%{opacity:.85}}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 82% 8%,rgba(255,236,150,.5),rgba(255,236,150,0) 70%),radial-gradient(ellipse 120% 60% at 50% 115%,rgba(255,190,90,.28),rgba(255,190,90,0) 70%);mix-blend-mode:screen;animation:glowBreath 7s ease-in-out infinite}
@keyframes glowBreath{50%{opacity:.7}}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,#fffbe0 0,rgba(255,240,170,.85) 28%,rgba(255,225,120,0) 70%);mix-blend-mode:screen;
  animation:orbFloat var(--t) ease-in-out var(--d) infinite}
@keyframes orbFloat{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.95}50%{transform:translate(var(--x),-170px) scale(1)}80%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--x)*-.6),-380px) scale(.7)}}
.twk{position:absolute;width:var(--s);height:var(--s);animation:twk var(--t) ease-in-out var(--d) infinite;opacity:0}
.twk::before,.twk::after{content:"";position:absolute;left:50%;top:50%;background:#fff8d0;border-radius:4px;box-shadow:0 0 14px 4px rgba(255,235,140,.9)}
.twk::before{width:100%;height:12%;transform:translate(-50%,-50%)}.twk::after{width:12%;height:100%;transform:translate(-50%,-50%)}
@keyframes twk{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
/* cahaya pada elemen */
.mascot img,.mascot svg{filter:drop-shadow(0 14px 0 rgba(0,0,0,.14)) drop-shadow(0 0 26px rgba(255,236,150,.75));animation:mglow 3.4s ease-in-out infinite}
@keyframes mglow{50%{filter:drop-shadow(0 14px 0 rgba(0,0,0,.14)) drop-shadow(0 0 46px rgba(255,240,170,1))}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
.opt.ok,.fb.ok{box-shadow:0 8px 0 #1f8c52,0 0 40px 10px rgba(255,235,120,.85)}
.star.on{filter:drop-shadow(0 0 22px rgba(255,220,80,.95))}
.slot.ready{box-shadow:0 0 28px 8px rgba(255,230,120,.8)}

/* ---------- scene (placeholder background) ---------- */
.scene{position:absolute;inset:0;overflow:hidden}
.scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sun{position:absolute;right:170px;top:90px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff7b0,#ffd84d 60%,#ffc233);box-shadow:0 0 90px 30px rgba(255,224,100,.55)}
.cloud{position:absolute;height:70px;width:210px;border-radius:70px;background:#fff;opacity:.92;filter:drop-shadow(0 8px 0 rgba(120,170,200,.25))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:100px;height:100px;left:34px;top:-48px}.cloud::after{width:80px;height:80px;left:106px;top:-30px}
.c1{left:8%;top:150px;animation:drift 40s linear infinite alternate}.c2{left:52%;top:250px;transform:scale(.8);animation:drift 55s linear infinite alternate-reverse}
@keyframes drift{from{translate:-60px 0}to{translate:140px 0}}
.hill{position:absolute;border-radius:50%}
.hl1{left:-10%;bottom:-420px;width:75%;height:720px}.hl2{right:-15%;bottom:-460px;width:85%;height:700px;filter:brightness(.93)}
.field{position:absolute;left:0;right:0;bottom:0;height:150px;background:repeating-linear-gradient(100deg,#8be07f 0 46px,#76d06b 46px 92px);box-shadow:inset 0 14px 0 rgba(255,255,255,.18)}
.dec{position:absolute;filter:drop-shadow(0 10px 0 rgba(0,0,0,.12))}

/* ---------- common ui ---------- */
.btn{font-family:inherit;border:0;cursor:pointer;border-radius:999px;font-weight:700;font-size:38px;padding:0 54px;height:92px;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(#ffb347,var(--orange));box-shadow:0 8px 0 var(--orange-d),0 14px 22px rgba(80,40,0,.28);transition:transform .12s,box-shadow .12s;text-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--orange-d),0 6px 12px rgba(80,40,0,.25)}
.btn.green{background:linear-gradient(#66e3a9,var(--mint-d));box-shadow:0 8px 0 #2a9a72,0 14px 22px rgba(0,60,40,.25)}
.btn.green:active{box-shadow:0 2px 0 #2a9a72}
.btn.blue{background:linear-gradient(#69bdff,#2e9bff);box-shadow:0 8px 0 #1d73c4,0 14px 22px rgba(0,40,90,.25)}
.btn.blue:active{box-shadow:0 2px 0 #1d73c4}
.btn.sm{height:76px;font-size:30px;padding:0 34px}
.btn.xl{height:108px;font-size:46px;padding:0 70px}
.ico{width:44px;height:44px;object-fit:contain;display:inline-block;flex:none}
.emo{display:inline-grid;place-items:center;font-size:38px;line-height:1;text-shadow:none}
.round{width:80px;height:80px;border-radius:50%;border:6px solid var(--wood-d);background:linear-gradient(#fffaf0,#ffe7b0);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 var(--wood-d),0 10px 16px rgba(60,30,0,.25);padding:0;color:var(--ink);transition:transform .12s}
.round:active{transform:translateY(5px)}
.round .ico{width:46px;height:46px}.round .emo{font-size:40px}
.pill{height:80px;border-radius:999px;border:6px solid var(--wood-d);background:linear-gradient(#fffaf0,#ffe7b0);display:inline-flex;align-items:center;gap:12px;padding:0 30px 0 22px;font-size:30px;font-weight:700;cursor:pointer;box-shadow:0 6px 0 var(--wood-d),0 10px 16px rgba(60,30,0,.25);color:var(--ink);transition:transform .12s}
.pill:active{transform:translateY(5px)}
.chip{height:68px;border-radius:999px;background:var(--cream);border:5px solid var(--wood-d);display:inline-flex;align-items:center;gap:10px;padding:0 24px;font-size:30px;font-weight:700;box-shadow:0 5px 0 rgba(60,30,0,.45)}
.chip .emo{font-size:30px}.chip .ico{width:34px;height:34px}
.hdr{position:absolute;left:0;top:0;right:0;height:112px;display:flex;align-items:center;gap:18px;padding:0 34px;background:linear-gradient(#b9763f,#8f5a31);border-bottom:8px solid var(--wood-d);box-shadow:0 8px 20px rgba(40,20,0,.3);z-index:5}
.hdr .ttl{flex:1;min-width:0;color:#fff;text-shadow:0 3px 0 rgba(60,30,0,.5);text-align:center}
.hdr .ttl b{display:block;font-size:40px;line-height:1.05}.hdr .ttl small{font-size:28px;opacity:.95;font-weight:500}
.hdr .grp{display:flex;gap:14px;align-items:center}

/* ---------- splash ---------- */
#s-splash .logo{position:absolute;left:100px;top:96px;width:1000px}
.logo h1{margin:0;font-size:150px;line-height:.92;font-weight:700;letter-spacing:2px;color:#ffd84d;-webkit-text-stroke:14px #6b4226;paint-order:stroke fill;text-shadow:0 14px 0 #6b4226,0 24px 30px rgba(0,0,0,.25);transform:rotate(-2deg)}
.logo h1 span{display:block;color:#fff6c8}
.ribbon{display:inline-block;margin-top:44px;padding:16px 46px;border-radius:20px;background:linear-gradient(#ff8fb8,#ff6fa0);border:6px solid #b8366a;color:#fff;font-size:46px;font-weight:700;text-shadow:0 3px 0 rgba(120,20,60,.5);box-shadow:0 8px 0 #b8366a;letter-spacing:1px}
.splash-btns{position:absolute;left:100px;bottom:96px;display:flex;gap:30px}
.splash-mascot{position:absolute;right:110px;bottom:60px;width:560px;height:760px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-16px)}}
.splash-deco{position:absolute;right:720px;bottom:120px;font-size:150px;animation:bob 4s ease-in-out infinite}
.mascot img,.mascot svg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 14px 0 rgba(0,0,0,.14))}
.tools{position:absolute;right:34px;top:30px;display:flex;gap:16px;z-index:6}

/* ---------- map ---------- */
#s-map .hdr .ttl b{font-size:44px}
.pieces{position:absolute;left:44px;top:136px;display:flex;align-items:center;gap:14px;padding:14px 24px;border-radius:30px;background:rgba(255,248,230,.94);border:6px solid var(--wood);box-shadow:0 8px 0 var(--wood-d)}
.pieces .lb{font-size:28px;font-weight:700;margin-right:6px}
.piece{min-width:150px;height:66px;border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:700;letter-spacing:1px;border:4px dashed #c9a46f;color:#c9a46f;background:#fff3d8;position:relative;overflow:hidden}
.piece.got{border:4px solid #d9a400;color:var(--wood-d);background:linear-gradient(#fff3a6,#ffd84d);box-shadow:0 4px 0 #b88700;animation:pop .6s}
.piece img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.piece span{position:relative;z-index:1}
.tot{position:absolute;right:44px;top:136px;display:flex;gap:14px}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:300px;transform:translate(-50%,-50%);text-align:center;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.orb{width:176px;height:176px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:88px;border:9px solid var(--wood-d);box-shadow:0 10px 0 var(--wood-d),0 18px 24px rgba(40,20,0,.3);position:relative;transition:transform .15s}
.node:active .orb{transform:translateY(6px)}
.node.cur .orb{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.node.lock .orb{filter:grayscale(.85) brightness(.9)}
.node .no{position:absolute;right:-6px;top:-8px;width:60px;height:60px;border-radius:50%;background:#fff;border:5px solid var(--wood-d);font-size:30px;font-weight:700;display:grid;place-items:center}
.node .lab{margin-top:20px;display:inline-block;padding:8px 26px 10px;border-radius:22px;background:rgba(255,248,230,.96);border:5px solid var(--wood);box-shadow:0 6px 0 var(--wood-d)}
.node .lab b{display:block;font-size:34px;line-height:1.1}.node .lab small{font-size:28px;font-weight:600;color:#7a5230}
.node .go{position:absolute;left:50%;top:-64px;translate:-50% 0;font-size:56px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{translate:-50% 14px}}
.map-foot{position:absolute;left:44px;bottom:36px;display:flex;gap:18px}
.map-tip{position:absolute;right:44px;bottom:44px;padding:12px 26px;border-radius:999px;background:rgba(255,248,230,.94);border:5px solid var(--wood);font-size:28px;font-weight:600}

/* ---------- game ---------- */
.prog{position:absolute;left:50px;right:50px;top:128px;height:34px;border-radius:999px;background:rgba(255,255,255,.85);border:5px solid var(--wood-d);overflow:hidden;box-shadow:0 4px 0 rgba(60,30,0,.35)}
.prog .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffd84d,#ff9a3c);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.prog .pt{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--wood-d);letter-spacing:.5px}
.board{position:absolute;left:50px;top:182px;width:840px;padding:20px 24px 24px;border-radius:36px;background:linear-gradient(#fffaf0,#fff1d2);border:8px solid var(--wood);box-shadow:0 12px 0 var(--wood-d),0 22px 30px rgba(60,30,0,.3)}
.board h3{margin:0 0 14px;font-size:30px;display:flex;align-items:center;gap:12px;color:var(--wood-d)}
.board h3 .ico{width:44px;height:44px}
.board .say{margin-left:auto;font-size:27px;padding:0 20px;height:56px;border-width:4px;box-shadow:0 4px 0 var(--wood-d)}
.lines{position:relative;display:flex;flex-direction:column;gap:14px}
.pl{height:86px;display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:24px;background:#fff;border:4px solid #f0dcb4;font-size:33px;font-weight:600;white-space:nowrap;position:relative;transition:transform .15s,background .25s,border-color .25s,box-shadow .25s}
.pl .txt{flex:1;min-width:0;padding-right:84px}
.pl .num{flex:none;width:52px;height:52px;border-radius:50%;background:#ffe9b0;display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--wood-d);transition:all .3s}
.num.gA{background:var(--A);color:#fff;animation:pop .5s}.num.gB{background:var(--B);color:#fff;animation:pop .5s}
.pl.tap{cursor:pointer;border-color:#ffd27a}.pl.tap:active{transform:scale(.98)}
.pl.sel{background:#fff4c2;border-color:var(--orange);box-shadow:0 0 0 6px rgba(255,154,60,.35);transform:scale(1.02)}
.pl.mA{background:#fff0e6;border-color:var(--A)}.pl.mB{background:#e8f4ff;border-color:var(--B)}
.pl.shake{animation:shake .45s}
.end{font-weight:700}.end.cA{color:var(--A)}.end.cB{color:var(--B)}
.slot{display:inline-block;vertical-align:middle;min-width:150px;height:56px;line-height:50px;margin-left:2px;border-radius:16px;border:4px dashed var(--orange);background:#fff7e0;text-align:center;font-weight:700;color:var(--ok);transition:all .2s}
.slot.ready{animation:pulse2 .9s ease-in-out infinite;background:#fff0b8}
.slot.over{background:#ffe27a;transform:scale(1.08);border-style:solid}
.slot.filled{border:4px solid var(--ok);background:#e3fbed;animation:pop .5s}
.slot.shake{animation:shake .45s}
@keyframes pulse2{50%{transform:scale(1.07)}}
.arcs{position:absolute;right:0;top:0;width:100px;height:100%;pointer-events:none;overflow:visible}

.ex{font-size:29px;font-weight:600;color:#2a6e4a;background:#e8fbf0;border-radius:22px;padding:10px 22px;border:3px solid #9be0b9;display:none}
.ex.on{display:block;animation:slideIn .4s}
.fbrow{margin-top:auto;display:flex;gap:16px;align-items:center}
.fb{flex:1;height:82px;border-radius:999px;display:flex;align-items:center;padding:0 30px;font-size:31px;font-weight:700;background:rgba(255,255,255,.93);color:#8a6a4a;border:4px dashed #e2c89a}
.fb.ok{background:#dcfbe8;color:#1f8c52;border:4px solid var(--ok);animation:pop .5s}
.fb.no{background:#fff0e0;color:#c35a1c;border:4px solid #ffb06e;animation:shake .45s}
.pairslots{display:flex;gap:16px}
.pairslot{flex:1;height:130px;border-radius:28px;border:6px dashed #c9d9e4;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;gap:16px;font-size:34px;font-weight:700;color:#9db3c3}
.pairslot.A{border:6px solid var(--A);background:#fff0e6;color:var(--A);animation:pop .5s}.pairslot.B{border:6px solid var(--B);background:#e8f4ff;color:var(--B);animation:pop .5s}
.pairslot .bd{width:54px;height:54px;border-radius:50%;background:currentColor;display:grid;place-items:center}.pairslot .bd i{color:#fff;font-style:normal;font-size:30px}

.pc.mA{background:#fff0e6;border-color:var(--A);color:var(--A);pointer-events:none}.pc.mB{background:#e8f4ff;border-color:var(--B);color:var(--B);pointer-events:none}
.pc.shake{animation:shake .45s}
.bank{display:flex;flex-wrap:wrap;gap:20px;padding:24px;border-radius:30px;background:rgba(255,255,255,.9);border:5px dashed var(--wood);min-height:130px}
.chip-w{min-width:170px;height:88px;padding:0 30px;border-radius:24px;font-size:44px;font-weight:700;display:grid;place-items:center;cursor:grab;background:linear-gradient(#fff3a6,#ffd84d);border:6px solid #d9a400;box-shadow:0 8px 0 #b88700;color:var(--wood-d);touch-action:none;transition:transform .12s}
.chip-w.sel{transform:translateY(-8px) scale(1.06);box-shadow:0 14px 0 #b88700,0 0 0 8px rgba(255,154,60,.4)}

.readbox{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0}

/* ---------- overlays ---------- */

.row{display:flex;gap:22px;justify-content:center;margin-top:22px}

#toast.on{opacity:1;translate:-50% 0}
#fx{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#fx i{position:absolute;top:-40px;width:18px;height:30px;border-radius:5px;animation:fall linear forwards}
#fx img.fxi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade 3s forwards reverse}
@keyframes fall{to{transform:translateY(1180px) rotate(900deg)}}
.spark{position:absolute;z-index:75;pointer-events:none;font-size:44px;font-weight:700;animation:sparkle .9s ease-out forwards}
@keyframes sparkle{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

<script>
(function(){
'use strict';
/* =====================================================================
   KAMPUNG PANTUN — Petualangan Pemburu Rima
   Materi: Buku Bahasa Indonesia "Keluargaku Unik" SD Kelas II, Bab 6
           "Bijak Memakai Uang", hlm. 136–137, refleksi hlm. 142.
   ===================================================================== */

/* ---------- util ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const stage=$('#stage');
let STAGE={s:1,ox:0,oy:0};

/* =====================================================================
   1. ASSET MANAGER — ganti gambar cukup dengan menaruh file PNG
      bernama sama di folder assets/. Jika belum ada → placeholder CSS.
   ===================================================================== */
const ASSETS={
  characters:['mascot-adventurer','mascot-happy','mascot-thinking','mascot-celebrating'],
  backgrounds:['bg-main-village','bg-poetry-house','bg-rhyme-bridge','bg-sound-detective','bg-poetry-workshop','bg-poetry-stage'],
  objects:['object-poetry-book','object-word-card','object-star','object-trophy','object-medal','btn-start','btn-help'],
  icons:['icon-home','icon-sound','icon-star','icon-check','icon-hint','btn-fullscreen','btn-music-on','btn-music-off'],
  effects:['effect-confetti','effect-sparkle']
};
const ASSET_DIR={};Object.keys(ASSETS).forEach(d=>ASSETS[d].forEach(n=>ASSET_DIR[n]=d));
const ASSET_OK={};
const ASSET_VER='20261124a';const assetUrl=n=>'assets/'+ASSET_DIR[n]+'/'+n+'.png?v='+ASSET_VER;
/* Muat aset satu per satu (tanpa batas waktu mati): gambar yang lambat tetap ditunggu, bukan diganti gambar pengganti.
   KRITIS = dibutuhkan layar awal & peta; sisanya (latar level) dimuat di belakang layar. */
const ASSET_LATER=['bg-rhyme-bridge','bg-sound-detective','bg-poetry-workshop','bg-poetry-stage','bg-poetry-house'];
const ASSET_JOB={};
function loadAsset(n){
  if(ASSET_JOB[n])return ASSET_JOB[n];
  return ASSET_JOB[n]=new Promise(res=>{
    const im=new Image();let tries=0;
    const go=()=>{im.src=assetUrl(n)+(tries?'&r='+tries:'')};
    im.onload=()=>{ASSET_OK[n]=true;res(true)};
    im.onerror=()=>{if(++tries<=1){setTimeout(go,500)}else{ASSET_OK[n]=false;res(false)}};
    go();
  });
}
function preload(list,onProg){
  const names=list||Object.keys(ASSET_DIR);let done=0;
  return Promise.all(names.map(n=>loadAsset(n).then(r=>{done++;if(onProg)onProg(done,names.length);return r})));
}
/* layar "Memuat..." di dalam panggung */
function showLoader(txt){
  let L=$('#loader');
  if(!L){L=document.createElement('div');L.id='loader';L.innerHTML='<div class="ld-t">KAMPUNG PANTUN</div><div class="ld-bar"><i></i></div><div class="ld-p">Memuat petualangan…</div>';stage.appendChild(L)}
  L.classList.add('on');if(txt)$('.ld-p',L).textContent=txt;return L}
function loaderProg(d,t){const L=$('#loader');if(!L)return;$('.ld-bar i',L).style.width=Math.round(d/t*100)+'%';$('.ld-p',L).textContent='Memuat petualangan… '+Math.round(d/t*100)+'%'}
function hideLoader(){const L=$('#loader');if(L)L.classList.remove('on')}
/* pastikan latar level sudah termuat sebelum level dimulai */
function whenAssets(list,fn){
  const need=list.filter(n=>ASSET_DIR[n]&&ASSET_OK[n]===undefined);
  if(!need.length){fn();return}
  showLoader('Menyiapkan level…');
  Promise.race([Promise.all(need.map(loadAsset)),sleep(20000)]).then(()=>{hideLoader();fn()});
}
function img(n,cls,fallback){return ASSET_OK[n]?'<img class="'+cls+'" src="'+assetUrl(n)+'" alt="" draggable="false">':(fallback||'')}
function ico(n,emoji){return ASSET_OK[n]?'<img class="ico" src="'+assetUrl(n)+'" alt="" draggable="false">':'<span class="emo">'+emoji+'</span>'}

/* ---------- maskot (SVG placeholder bila PNG belum ada) ---------- */
function mascotSVG(m){
  const skin='#f7c9a0';
  const arm=(x1,y1,x2,y2)=>'<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+skin+'" stroke-width="17" stroke-linecap="round" fill="none"/><circle cx="'+x2+'" cy="'+y2+'" r="11" fill="'+skin+'"/>';
  let arms,mouth,brows='',extra='',px=0,py=0;
  if(m==='celebrating'){arms=arm(66,146,34,94)+arm(134,146,166,94);mouth='<path d="M76 104 Q100 142 124 104 Z" fill="#c2382f"/><path d="M88 120 Q100 130 112 120 Q100 112 88 120Z" fill="#ff8f8f"/>';extra='<text x="8" y="62" font-size="32">✨</text><text x="156" y="58" font-size="32">⭐</text>'}
  else if(m==='happy'){arms=arm(66,146,48,196)+arm(134,146,168,102);mouth='<path d="M80 104 Q100 134 120 104 Z" fill="#c2382f"/><path d="M90 118 Q100 126 110 118 Q100 112 90 118Z" fill="#ff8f8f"/>'}
  else if(m==='thinking'){arms=arm(66,146,48,196)+arm(134,150,114,124);mouth='<circle cx="106" cy="113" r="6" fill="#c2382f"/>';brows='<path d="M66 70 Q80 62 94 70" stroke="#5a3a1f" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M106 64 Q120 60 134 70" stroke="#5a3a1f" stroke-width="5" fill="none" stroke-linecap="round"/>';extra='<text x="146" y="44" font-size="38" font-weight="700" fill="#2e9bff">?</text>';px=3;py=-3}
  else{arms=arm(66,146,46,196)+arm(134,146,154,196);mouth='<path d="M84 106 Q100 122 116 106" stroke="#a8342b" stroke-width="5" fill="none" stroke-linecap="round"/>'}
  return '<svg viewBox="0 0 200 262" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
   '<ellipse cx="100" cy="252" rx="54" ry="8" fill="rgba(0,0,0,.15)"/>'+
   '<rect x="78" y="200" width="18" height="42" rx="8" fill="'+skin+'"/><rect x="104" y="200" width="18" height="42" rx="8" fill="'+skin+'"/>'+
   '<ellipse cx="84" cy="244" rx="18" ry="9" fill="#7a5230"/><ellipse cx="116" cy="244" rx="18" ry="9" fill="#7a5230"/>'+
   '<rect x="68" y="186" width="64" height="34" rx="12" fill="#7a5230"/>'+
   '<rect x="62" y="126" width="76" height="76" rx="26" fill="#ff9a3c"/><rect x="62" y="156" width="76" height="12" fill="#ffc07a"/>'+
   '<path d="M78 128 L78 190 M122 128 L122 190" stroke="#8a5a36" stroke-width="7" stroke-linecap="round"/>'+
   arms+
   '<circle cx="54" cy="86" r="10" fill="'+skin+'"/><circle cx="146" cy="86" r="10" fill="'+skin+'"/>'+
   '<circle cx="100" cy="84" r="47" fill="'+skin+'"/>'+
   '<path d="M54 74 Q52 100 62 106 Q58 86 66 70Z M146 74 Q148 100 138 106 Q142 86 134 70Z" fill="#4a2e1b"/>'+
   '<ellipse cx="100" cy="56" rx="66" ry="14" fill="#ffd84d" stroke="#d9a400" stroke-width="4"/>'+
   '<path d="M56 54 Q58 6 100 6 Q142 6 144 54 Z" fill="#ffd84d" stroke="#d9a400" stroke-width="4"/>'+
   '<path d="M57 44 Q100 54 143 44 L144 54 Q100 64 56 54Z" fill="#ff7a3d"/>'+
   '<text x="88" y="38" font-size="24">⭐</text>'+
   brows+
   '<circle cx="'+(80+px)+'" cy="'+(90+py)+'" r="8" fill="#3a2314"/><circle cx="'+(120+px)+'" cy="'+(90+py)+'" r="8" fill="#3a2314"/>'+
   '<circle cx="'+(83+px)+'" cy="'+(87+py)+'" r="3" fill="#fff"/><circle cx="'+(123+px)+'" cy="'+(87+py)+'" r="3" fill="#fff"/>'+
   '<circle cx="68" cy="104" r="8" fill="#ff9fb4" opacity=".7"/><circle cx="132" cy="104" r="8" fill="#ff9fb4" opacity=".7"/>'+
   mouth+extra+'</svg>';
}
function mascotHTML(m){
  /* bila mascot-adventurer.png belum ada, pakai pose lain agar gaya tetap konsisten */
  let k=m;
  if(!ASSET_OK['mascot-'+k]){const alt=['happy','thinking','celebrating'].find(x=>ASSET_OK['mascot-'+x]);if(alt)k=alt}
  return ASSET_OK['mascot-'+k]?img('mascot-'+k,''):mascotSVG(m);
}

/* ---------- latar (placeholder CSS bila PNG belum ada) ---------- */
const SCENES={
  'bg-main-village':{sky:['#7ed3ff','#dff6ff'],h1:'#8fe3b4',h2:'#5fcf97',deco:['🏡','🌳','🌾','🏠','🌴']},

const Snd={ctx:null,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume()}catch(e){}}},
  tone(f,t0,d,type,v){const c=this.ctx;if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.16,t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}},
  play(n){if(!save.sound)return;if((n==='ok'||n==='no')&&SFX.play(n))return;this.init();

  }
};

const CHEER=['Ayo, kamu pasti bisa!','Baca pelan-pelan, ya.','Semangat, Pemburu Rima!','Teliti dulu sebelum menjawab!'];
function renderStep(){
  const st=curStep();

/* ----- papan pantun ----- */
function renderBoard(){
  const st=curStep(),mode=st.board||'plain';
  const lines=PANTUN.map((p,i)=>{
    const shown=G.reveal.has(i),g=p.g;
    const num=shown?'<span class="num g'+g+'">'+g+'</span>':'<span class="num">'+(i+1)+'</span>';
    let end;
    if(mode==='blanks'&&st.blanks.includes(i)){
      const w=G.filled[i];
      end='<span class="slot'+(w?' filled':'')+(G.sub.selChip&&!w?' ready':'')+'" data-i="'+i+'">'+(w||'')+'</span>';
    }else{
      end='<b class="end'+((shown||mode==='badges'||mode==='full')?' c'+g:'')+'">'+p.end+'</b>';
    }
    const cls=['pl'];
    if(mode==='pairs'&&!shown)cls.push('tap');
    if(mode==='pairs'&&G.sub.sel===i)cls.push('sel');
    if(shown&&mode!=='plain')cls.push('m'+g);
    return '<div class="'+cls.join(' ')+'" data-i="'+i+'">'+num+'<span class="txt">'+p.pre+' '+end+'</span></div>';
  }).join('');
  const H=4*86+3*14;
  const ys=[43,143,243,343];
  const arc=(g,a,b,bulge,col)=>(G.reveal.has(a)&&G.reveal.has(b)&&mode!=='plain')?'<path d="M10 '+ys[a]+' C'+bulge+' '+ys[a]+' '+bulge+' '+ys[b]+' 10 '+ys[b]+'" stroke="'+col+'"/>':'';
  const arcs='<svg class="arcs" viewBox="0 0 100 '+H+'" preserveAspectRatio="none">'+arc('A',0,2,92,'#ff7a3d')+arc('B',1,3,56,'#2e9bff')+'</svg>';
  const showLegend=mode==='pairs'||mode==='badges'||mode==='full';
  $('#board').innerHTML='<h3>'+(ASSET_OK['object-poetry-book']?img('object-poetry-book','ico',''):'<span class="emo">📖</span>')+'Papan Pantun'+
    '<button class="pill say" data-act="speak"><span class="emo">🔊</span>Dengarkan</button></h3>'+
    '<div class="lines">'+lines+arcs+'</div>'+
    (showLegend?'<div class="legend"><span><i style="background:var(--A)"></i>Rima A</span><span><i style="background:var(--B)"></i>Rima B</span></div>':'');
  if(!('speechSynthesis' in window)){const s=$('#board .say');if(s)s.style.display='none'}
}

    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(PANTUN.map(p=>p.pre+' '+p.end).join('. ')+'.');
    u.lang='id-ID';u.rate=.8;speechSynthesis.speak(u);

const OKTXT='Hebat! Jawabanmu benar!',NOTXT='Belum tepat, yuk coba sekali lagi!';

function blunder(){G.sub.miss=true;G.mistakes++;snd('no');setFb('no',NOTXT);say('Tidak apa-apa! Coba lagi, ya. Kamu pasti bisa!','thinking')}

/* ----- mencocokkan pasangan (baris di papan / kata di panel) ----- */
function addFound(a,b,g){
  G.sub.found.push({a,b,g});
  const slot=$('#ps'+(G.sub.found.length-1));
  if(slot){slot.className='pairslot '+g;slot.innerHTML='<span class="bd"><i>'+g+'</i></span><span>'+a+' ⟷ '+b+'</span>'}
}
function onLineTap(i){
  const st=curStep();
  if(!st||st.on!=='board'||G.sub.done||G.reveal.has(i))return;
  const sel=G.sub.sel;
  if(sel===null||sel===undefined){G.sub.sel=i;snd('tap');renderBoard();return}
  if(sel===i){G.sub.sel=null;renderBoard();return}
  if(PANTUN[sel].g===PANTUN[i].g){
    G.reveal.add(sel);G.reveal.add(i);G.sub.sel=null;renderBoard();
    const g=PANTUN[i].g;
    addFound(PANTUN[Math.min(sel,i)].end,PANTUN[Math.max(sel,i)].end,g);
    credit($('#board .pl[data-i="'+i+'"]'));
    setFb('ok','Pasangan rima '+g+' ditemukan!');say('Jembatan rima '+g+' terbentuk! Bunyi akhirnya sama.','happy');
    if(G.reveal.size===4)stepDone('Baris 1 dan 3 berima (A), baris 2 dan 4 berima (B). Pola: A-B-A-B.');
  }else{
    const a=$('#board .pl[data-i="'+sel+'"]'),b=$('#board .pl[data-i="'+i+'"]');
    G.sub.sel=null;renderBoard();
    $$('#board .pl').forEach(e=>{if(+e.dataset.i===sel||+e.dataset.i===i){e.classList.add('shake')}});
    blunder();
  }
}
function onPc(btn){
  const st=curStep();if(!st||st.on!=='words'||G.sub.done)return;
  const k=+btn.dataset.k;if(G.sub.matched.has(k))return;
  const sel=G.sub.sel;
  if(sel===null||sel===undefined){G.sub.sel=k;snd('tap');btn.classList.add('sel');return}
  if(sel===k){G.sub.sel=null;btn.classList.remove('sel');return}
  const A=G.sub.words[sel],B=G.sub.words[k],btnA=$('.pc[data-k="'+sel+'"]');
  G.sub.sel=null;btnA.classList.remove('sel');
  if(A.g===B.g){
    G.sub.matched.add(sel);G.sub.matched.add(k);
    btnA.classList.add('m'+A.g);btn.classList.add('m'+B.g);
    addFound(A.t,B.t,A.g);credit(btn);
    setFb('ok','Pasangan rima '+A.g+' ditemukan!');say(cap(A.t)+' dan '+B.t+' berima. Bunyi akhirnya sama!','happy');
    if(G.sub.matched.size===4)stepDone('Siang dan uang berima (A). Meja dan saja berima (B).');
  }else{
    btnA.classList.add('shake');btn.classList.add('shake');
    setTimeout(()=>{btnA.classList.remove('shake');btn.classList.remove('shake')},500);
    blunder();
  }
}

/* ----- melengkapi pantun: seret & lepas ATAU ketuk kata → ketuk tempat kosong ----- */
function tryPlace(word,i){
  const st=curStep();if(G.sub.done||G.filled[i]||!st.blanks.includes(i))return;
  const chip=$('#bank .chip-w[data-w="'+word+'"]');
  G.sub.selChip=null;$$('#bank .chip-w').forEach(c=>c.classList.remove('sel'));
  if(PANTUN[i].end===word){
    G.filled[i]=word;if(chip)chip.classList.add('used');
    renderBoard();credit($('#board .slot[data-i="'+i+'"]'));
    setFb('ok','Pas sekali! Kata itu berima.');
    if(st.blanks.every(b=>G.filled[b])){
      stepDone(st.blanks.length>1?'Pantun sudah lengkap, rimanya A-B-A-B!':'Kata “'+PANTUN[i].end+'” berima dengan “'+PANTUN[(i+2)%4].end+'”.');
    }else say('Satu kata sudah pas! Lanjutkan yang kosong.','happy');
  }else{
    renderBoard();
    const sl=$('#board .slot[data-i="'+i+'"]');if(sl){sl.classList.add('shake')}
    if(chip){chip.classList.add('shake');setTimeout(()=>chip.classList.remove('shake'),500)}
    blunder();
  }
}
function selectChip(chip){
  if(G.sub.done||chip.classList.contains('used'))return;
  const w=chip.dataset.w;
  if(G.sub.selChip===w){G.sub.selChip=null;chip.classList.remove('sel')}
  else{G.sub.selChip=w;$$('#bank .chip-w').forEach(c=>c.classList.toggle('sel',c===chip));snd('tap')}
  renderBoard();
}
function onSlotTap(slot){
  if(G.sub.done)return;
  const i=+slot.dataset.i;if(G.filled[i])return;
  if(!G.sub.selChip){toast('Ketuk dulu sebuah kata di bawah, ya!');return}
  tryPlace(G.sub.selChip,i);
}
function nearestSlot(x,y){
  let best=null,bd=1e9;
  $$('#board .slot').forEach(s=>{
    if(s.classList.contains('filled'))return;
    const r=s.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom);
    const d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=s}
  });
  return bd<=70*STAGE.s?best:null;
}
function startDrag(chip,e){
  e.preventDefault();
  const S={x0:e.clientX,y0:e.clientY,drag:false,ghost:null,id:e.pointerId};
  const w=chip.offsetWidth,h=chip.offsetHeight;
  const place=ev=>{S.ghost.style.left=((ev.clientX-STAGE.ox)/STAGE.s-w/2)+'px';S.ghost.style.top=((ev.clientY-STAGE.oy)/STAGE.s-h/2)+'px'};
  const move=ev=>{
    if(ev.pointerId!==S.id)return;
    if(!S.drag&&Math.hypot(ev.clientX-S.x0,ev.clientY-S.y0)>10){
      S.drag=true;
      S.ghost=chip.cloneNode(true);S.ghost.classList.add('ghost');S.ghost.classList.remove('sel');S.ghost.style.width=w+'px';S.ghost.style.height=h+'px';
      stage.appendChild(S.ghost);chip.classList.add('lift');G.sub.selChip=null;
    }
    if(S.drag){place(ev);const n=nearestSlot(ev.clientX,ev.clientY);$$('#board .slot').forEach(s=>s.classList.toggle('over',s===n))}
  };
  const end=ev=>{
    if(ev.pointerId!==S.id)return;
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
    chip.classList.remove('lift');
    $$('#board .slot').forEach(s=>s.classList.remove('over'));
    if(S.ghost)S.ghost.remove();
    if(S.drag){
      if(ev.type==='pointerup'){const n=nearestSlot(ev.clientX,ev.clientY);if(n)tryPlace(chip.dataset.w,+n.dataset.i);else snd('tap')}
    }else if(ev.type==='pointerup'){selectChip(chip)}
  };
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
}

/* =====================================================================
   9. AKHIR LEVEL, PENGHARGAAN, HASIL
   ===================================================================== */
function finishLevel(){
  const L=G.lv,stars=G.mistakes===0?3:G.mistakes<=2?2:1;
  const prev=lvRec(L.id);
  const better=!prev||G.score>=(prev.score||0);
  save.levels[L.id]={done:true,stars:Math.max(stars,prev?prev.stars||0:0),
    score:better?G.score:prev.score,correct:better?G.firstOK:prev.correct,total:better?G.items:prev.total};
  writeSave();updateHUD();$('#gFill').style.width='100%';
  const msg=stars===3?'Luar biasa! Tanpa salah sedikit pun!':stars===2?'Bagus sekali! Sedikit lagi sempurna.':'Kamu hebat sudah menyelesaikannya! Coba lagi untuk bintang lebih banyak.';
  const star=(i)=>'<div class="star'+(i<stars?' on':'')+'" style="animation-delay:'+(i*.3)+'s">'+(ASSET_OK['object-star']?img('object-star','',''):'⭐')+'</div>';
  const piece=L.piece?'<p>Kamu mendapat keping kata: <b style="font-size:40px;color:var(--orange-d)">'+L.piece.toUpperCase()+'</b> 🧩</p>':'';
  const last=L.id===LEVELS.length;
  $('#lvlOver').innerHTML='<div class="card" style="width:1100px"><h2>Level '+L.id+' Selesai!</h2><p style="font-size:36px">'+L.name+'</p>'+
    '<div class="stars">'+[0,1,2].map(star).join('')+'</div><p>'+msg+'</p>'+piece+
    '<p>Skor level ini: <b>'+G.score+'</b> &nbsp;•&nbsp; Benar di percobaan pertama: <b>'+G.firstOK+' / '+G.items+'</b></p>'+
    '<div class="row"><button class="btn green" data-act="afterLevel">'+(last?'Lihat Penghargaan <span class="emo">🏆</span>':'Lanjut ke Level '+(L.id+1)+' <span class="emo">▶</span>')+'</button>'+
    '<button class="btn sm blue" data-act="retry">Ulangi Level</button><button class="btn sm" data-act="map">Peta</button></div></div>';
  $('#lvlOver').classList.add('on');
  say('Level selesai!','celebrating');
  snd('win');confetti(90);
  setTimeout(()=>snd('star'),500);
}
function renderAward(){
  $('#s-award').innerHTML=sceneHTML('bg-poetry-stage')+
   '<div class="tools">'+toolsHTML()+'</div>'+
   '<div class="award-box"><h2>SELAMAT!<br>KAMU TELAH MENJADI<br>PEMBURU RIMA HEBAT!</h2>'+
   '<div class="trophy">'+(ASSET_OK['object-trophy']?img('object-trophy','',''):'<span class="big">🏆</span>')+(ASSET_OK['object-medal']?img('object-medal','',''):'<span class="big med">🥇</span>')+'</div>'+
   '<button class="btn xl green" data-act="results"><span class="emo">📊</span>Lihat Hasil Akhir</button></div>';
}
function renderResult(){
  let correct=0,total=0,done=0;
  LEVELS.forEach(l=>{const r=lvRec(l.id);if(r&&r.done){done++;correct+=r.correct||0;total+=r.total||0}});
  const all=done===LEVELS.length;
  const mood=all?'celebrating':done>0?'happy':'adventurer';
  const star3=totalStars();
  const msg=all?'SELAMAT! KAMU TELAH MENJADI PEMBURU RIMA HEBAT!':done>0?'Kerja bagus! Ayo lanjutkan petualanganmu dan kumpulkan semua keping kata.':'Ayo mulai petualanganmu di peta!';
  $('#s-result').innerHTML=sceneHTML('bg-main-village')+
   '<div class="hdr"><button class="round" data-act="home" aria-label="Menu utama">'+homeIco()+'</button><div class="ttl"><b>Hasil Petualanganmu</b><small>Kampung Pantun</small></div><div class="grp">'+toolsHTML()+'</div></div>'+
   '<div class="res"><div class="mm mascot">'+mascotHTML(mood)+'</div><div class="card rc"><h2>'+(all?'🏆 ':'')+msg+'</h2>'+
   '<div class="grid4"><div class="stat"><b>'+totalScore()+'</b><small>Total Skor</small></div><div class="stat"><b>'+correct+' / '+total+'</b><small>Jawaban Benar (percobaan pertama)</small></div>'+
   '<div class="stat"><b>⭐ '+star3+' / 15</b><small>Total Bintang</small></div><div class="stat"><b>'+done+' / 5</b><small>Level Diselesaikan</small></div></div>'+
   '<div class="row"><button class="btn green" data-act="again"><span class="emo">🔁</span>MAIN LAGI</button><button class="btn blue" data-act="map"><span class="emo">🗺️</span>KEMBALI KE PETA</button></div></div></div>';
  if(all){confetti(80);snd('win')}
}
function resetAll(){save.levels={};writeSave()}
function confirmReset(after){
  modal('<div class="card" style="width:1000px"><h2>Ulangi dari awal?</h2><p>Semua bintang dan skor akan dihapus, lalu kamu mulai petualangan lagi dari Level 1.</p>'+
    '<div class="row"><button class="btn green" data-act="doReset">Ya, ulangi!</button><button class="btn blue" data-act="closeModal">Batal</button></div></div>');
}

/* =====================================================================
   10. EVENT (satu pintu, mendukung mouse & sentuh)
   ===================================================================== */
function goMap(){renderMap();show('map')}
function goHome(){renderSplash();show('splash')}

/* efek sentuh: cincin cahaya + percikan kecil pada tombol yang ditekan */
const TOUCHABLE='.btn,.bimg,.round,.pill,.opt,.node,.pc,.pl.tap,.chip-w';
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest&&e.target.closest(TOUCHABLE);if(!t||t.disabled)return;
  const el=t.classList.contains('node')?(t.querySelector('.orb')||t):t;
  el.classList.remove('tch');void el.offsetWidth;el.classList.add('tch');setTimeout(()=>el.classList.remove('tch'),600);
  try{const x=(e.clientX-STAGE.ox)/STAGE.s,y=(e.clientY-STAGE.oy)/STAGE.s;
    for(let i=0;i<6;i++){const d=document.createElement('span');d.className='tdot';d.style.left=x+'px';d.style.top=y+'px';
      const a=Math.PI*2*i/6+Math.random()*.6,r=50+Math.random()*50;
      d.style.setProperty('--dx',Math.cos(a)*r+'px');d.style.setProperty('--dy',Math.sin(a)*r+'px');
      stage.appendChild(d);setTimeout(()=>d.remove(),650)}}catch(_){}
},true);
stage.addEventListener('click',e=>{
  Snd.init();
  const slot=e.target.closest('.slot');
  if(slot&&curScreen==='game'){onSlotTap(slot);return}
  const line=e.target.closest('#board .pl.tap');
  if(line&&curScreen==='game'){onLineTap(+line.dataset.i);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  switch(a){
    case 'start':snd('tap');goMap();break;
    case 'help':snd('tap');helpModal();break;
    case 'htab':{snd('tap');const t=el.dataset.t;$$('.htab').forEach(x=>x.classList.toggle('on',x===el));$$('.hp').forEach(x=>x.classList.toggle('on',x.dataset.p===t));break}
    case 'closeModal':snd('tap');closeOver();break;
    case 'home':snd('tap');goHome();break;
    case 'map':snd('tap');goMap();break;
    case 'sound':save.sound=!save.sound;writeSave();refreshSound();if(save.sound)snd('tap');break;
    case 'fs':{try{const d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}}catch(err){}break}
    case 'lvl':{const id=+el.dataset.id;if(!isOpen(id)){snd('no');toast('Selesaikan level sebelumnya dulu, ya! 🔒');break}snd('tap');startLevel(id);break}
    case 'results':snd('tap');renderResult();show('result');break;
    case 'reset':snd('tap');confirmReset();break;
    case 'doReset':resetAll();closeOver();goMap();toast('Petualangan dimulai dari awal!');break;
    case 'again':
      if(Object.values(save.levels).filter(l=>l.done).length>=LEVELS.length){resetAll();goMap()}else confirmReset();
      break;
    case 'opt':onOpt(el);break;
    case 'pc':onPc(el);break;
    case 'hint':giveHint();break;
    case 'next':nextStep();break;
    case 'speak':snd('tap');speak();break;
    case 'readDone':G.sub.done=true;snd('ok');burst(el);nextStep();break;
    case 'afterLevel':
      $('#lvlOver').classList.remove('on');
      if(G.lv.id===LEVELS.length){renderAward();show('award');confetti(100);snd('win')}
      else startLevel(G.lv.id+1);
      break;
    case 'retry':startLevel(G.lv.id);break;
  }
});
stage.addEventListener('pointerdown',e=>{
  Snd.init();
  const chip=e.target.closest('#bank .chip-w');
  if(chip&&curScreen==='game'&&!chip.classList.contains('used')&&!G.sub.done)startDrag(chip,e);
});

/* =====================================================================
   11. SKALA 16:9 + LETTERBOX
   ===================================================================== */
function fit(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const s=Math.min(vw/1920,vh/1080);
  STAGE={s,ox:(vw-1920*s)/2,oy:(vh-1080*s)/2};
  stage.style.transform='translate('+STAGE.ox+'px,'+STAGE.oy+'px) scale('+s+')';
  const portrait=vh>vw&&vw<900;
  $('#rot').classList.toggle('on',portrait&&!fit.dismissed);
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,200));
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
$('#rotOk').addEventListener('click',()=>{fit.dismissed=true;fit()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());

/* =====================================================================
   12. INISIALISASI
   ===================================================================== */
async function init(){
  loadSave();fit();
  stage.classList.add('ready');showLoader();
  try{
    const f=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
    const crit=Object.keys(ASSET_DIR).filter(n=>!ASSET_LATER.includes(n));
    await Promise.race([Promise.all([preload(crit,loaderProg),f]),sleep(25000)]);
  }catch(e){}
  try{renderSplash();show('splash');fit()}finally{hideLoader()}
  preload(ASSET_LATER);               // latar level dimuat di belakang layar
}
init();
})();
</script>
